server:
  front-end-url: "https://ris-portal.uat.tech.digitalservice.dev/"
  cms-url: "https://ris-cm.uat.tech.digitalservice.dev/"

swagger:
  server:
    url: "https://ris-portal.uat.tech.digitalservice.dev/"

spring:
  config:
    import:
      - "kubernetes:"
      - "optional:configtree:/etc/secrets/*/"
  cloud:
    kubernetes:
      config:
        fail-fast: true
        sources:
          - name: ris-search-opensearch-config

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

s3:
  file-storage:
    case-law:
      versionPrefix: "V1/"
