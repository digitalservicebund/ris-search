name: Smoke tests

on:
  workflow_call:
    secrets:
      SLACK_BOT_TOKEN:
        required: true
      STAGING_BASIC_AUTH_PASSWORD:
        required: true
      STAGING_BASIC_AUTH_USERNAME:
        required: true
  workflow_dispatch:

permissions:
  contents: read

env:
  RUN_ID: ${{ github.run_id }}

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    container:
      # Image version must match @playwright/test in frontend/package.json
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e # v1.62.1-noble
      options: --user 1001
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ./frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ./frontend/package.json
          cache: "pnpm"
          cache-dependency-path: ./frontend/pnpm-lock.yaml

      - name: Install Node modules
        run: pnpm ci
        working-directory: ./frontend

      - name: Run Playwright tests
        run: pnpm exec playwright test --project=smoke-tests
        working-directory: ./frontend
        env:
          STAGING_BASIC_AUTH_USERNAME: ${{ secrets.STAGING_BASIC_AUTH_USERNAME }}
          STAGING_BASIC_AUTH_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
          TZ: Europe/Berlin

      - name: Upload traces of failed smoke tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() }}
        with:
          name: failed-smoke-tests
          path: frontend/playwright-report/**/*.zip
          retention-days: 5

      - name: Send status to Slack
        uses: digitalservicebund/notify-on-failure-gha@671832f192aee0a068fd92b2f6deb975df794a84 # v1.6.1
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        with:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.NEURIS_PORTAL_ALERTS_SLACK_CHANNEL_ID }}
