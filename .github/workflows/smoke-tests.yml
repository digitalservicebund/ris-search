name: Smoke tests

on:
  workflow_call:
    secrets:
      SLACK_BOT_TOKEN:
        required: true
      STAGING_BASIC_AUTH_PASSWORD:
        required: true
      STAGING_BASIC_AUTH_USERNAME:
        required: true
  workflow_dispatch:

permissions:
  contents: read

env:
  RUN_ID: ${{ github.run_id }}

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    container:
      # Image version must match @playwright/test in frontend/package.json
      image: mcr.microsoft.com/playwright@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d # v1.65.0-noble
      options: --user 1001
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          working-directory: ./frontend
          cache: true
          require-lockfile: true

      - name: Run Playwright tests
        run: pnpm exec playwright test --project=smoke-tests
        working-directory: ./frontend
        env:
          STAGING_BASIC_AUTH_USERNAME: ${{ secrets.STAGING_BASIC_AUTH_USERNAME }}
          STAGING_BASIC_AUTH_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
          TZ: Europe/Berlin

      - name: Upload traces of failed smoke tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ failure() }}
        with:
          name: failed-smoke-tests
          path: frontend/playwright-report/**/*.zip
          retention-days: 5

      - name: Send status to Slack
        uses: digitalservicebund/notify-on-failure-gha@671832f192aee0a068fd92b2f6deb975df794a84 # v1.6.1
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        with:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.NEURIS_PORTAL_ALERTS_SLACK_CHANNEL_ID }}
