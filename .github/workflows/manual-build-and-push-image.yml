name: Manual Build and Push Image

on:
  workflow_dispatch:
    inputs:
      commit-sha:
        description: 'Target Git commit SHA on main (e.g., 4567ec31e3ad23437c3b8a56e3e9114b810b252f)'
        required: true
        type: string
      app:
        description: 'App for which the scan and attestation is run'
        required: true
        type: string
        default: 'backend'

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # This is used to complete the identity challenge with sigstore/fulcio..
      packages: write
    outputs:
      image-digest: ${{ steps.build-push-image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit-sha }}
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "25.0"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: ./backend
        run: chmod +x gradlew

      - name: Log into container registry
        # Third-party action, pin to commit SHA!
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build backend image
        id: build-push-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        # Note: We set the sentry release to the current commit sha so it is baked into the docker image
        # and supplied to the backend application at runtime so it can associate errors with the correct sentry release.
        # There is no need to create a sentry release in the backend pipeline as we already create one in the frontend pipeline
        # and the applications live a monorepo and we only have a single sentry project for both frontend & backend.
        with:
          file: backend/Dockerfile.prod
          context: backend
          tags: ghcr.io/${{ github.repository }}:${{ inputs.commit-sha }}
          push: true
          secrets: |
            GH_PACKAGES_REPOSITORY_USER=${{ github.actor }}
            GH_PACKAGES_REPOSITORY_TOKEN=${{ secrets.GITHUB_TOKEN }}
          build-args: |
            SENTRY_RELEASE=${{ inputs.commit-sha }}
      - name: Send status to Slack
        uses: digitalservicebund/notify-on-failure-gha@671832f192aee0a068fd92b2f6deb975df794a84 # v1.6.1
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        with:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.NEURIS_PORTAL_ALERTS_SLACK_CHANNEL_ID }}
  scan-attest-and-sign-image:
    needs: build-and-push-image
    uses: ./.github/workflows/scan-attest-sign-image.yml
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    with:
      # Use image digest instead of tag to uniquely identify the image
      image-reference: ghcr.io/${{ github.repository }}@${{ needs.build-and-push-image.outputs.image-digest }}
      app: ${{ inputs.app }}
      trivy-db-repository: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
      trivy-java-db-repository: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db
      trivy-offile-scan: true
