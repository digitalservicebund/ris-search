name: Manual Resign Old Image

on:
  workflow_dispatch:
    inputs:
      image-digest:
        description: 'The immutable SHA256 digest of the image (e.g., sha256:abcd123...)'
        required: true
        type: string
      app:
        description: 'App for which the scan and attestation is run'
        required: true
        type: string
        default: 'backend'

jobs:
  scan-attest-and-sign-image:
    uses: ./.github/workflows/scan-attest-sign-image.yml
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    with:
      # Use image digest instead of tag to uniquely identify the image
      image-reference: ghcr.io/digitalservicebund/ris-search@${{ inputs.image-digest }}
      app: ${{ inputs.app }}
      trivy-db-repository: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
      trivy-java-db-repository: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db
      trivy-offile-scan: true
