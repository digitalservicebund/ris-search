name: CI/CD pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - 'api-docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'api-docs/**'
  schedule:
    # This ensures that the applications container image is built, signed and deployed regularly.
    - cron: '0 8 * * 1,3' # Runs at 8:00am UTC (9am winter time/10am summer time in Germany) on Mondays and Wednesdays
  # Allow to run this workflow manually
  workflow_dispatch:

# On non-main branches, runs for the same workflow+ref share a concurrency group,
# so a newer run cancels any still-running older one (cancel-in-progress: true).
# On main, each run gets a unique group (run_id) so runs never cancel each other.
# github.workflow is included in the group key so two different workflows triggered
# by the same ref (e.g. this pipeline and the api-docs pipeline) don't cancel each other.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.run_id || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  RUN_ID: ${{ github.run_id }}

jobs:
  e2e-tests:
    uses: $/.github/workflows/pipeline-e2e.yml
    permissions:
      packages: read
      contents: read
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  backend-jobs:
    uses: $/.github/workflows/backend.yml
    permissions:
      contents: read
      pull-requests: read
      packages: write
      id-token: write
      security-events: write
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      container-registry: ghcr.io
      image-reference: ghcr.io/${{ github.repository }}:${{ github.sha }}

  frontend-jobs:
    uses: $/.github/workflows/frontend.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    with:
      container-registry: ghcr.io
      image-reference: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

  push-reports:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - e2e-tests
      - backend-jobs
      - frontend-jobs
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout ADRs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: doc/adr
          persist-credentials: false

      - name: Copy ADRs
        run: |
          mkdir -p tmp/adr-source
          find doc/adr/ -type f -exec cp {} tmp/adr-source/ \;
          ls -l tmp/adr-source

      - name: Download backend code documentation
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: backend-code-documentation
          path: tmp/backend-code-documentation/

      - name: Download backend licence report
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: licence-reports-backend
          path: tmp/licence-reports-backend/

      - name: Download frontend licence report
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: licence-reports-frontend
          path: tmp/licence-reports-frontend/

      - name: Download Storybook
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: storybook-static
          path: tmp/storybook-static/

      - name: Download E2E test reports
        if: ${{ !cancelled() && needs.e2e-tests.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: playwright-e2e-tests-report-*
          path: tmp/playwright-report/

      - name: Upload ADRs to ris-reports
        if: ${{ !cancelled() && hashFiles('tmp/adr-source/**') != '' }}
        uses: digitalservicebund/add-ris-report@31a248ea368f94bfa3a012da3c202bcc6be2debe
        with:
          filePath: tmp/adr-source
          destinationDir: adr/ris-search
          reportIsDirectory: true
          keepAllVersions: false
          BUCKET_ACCESS_KEY_ID: ${{ secrets.REPORTS_BUCKET_ACCESS_KEY_ID }}
          BUCKET_SECRET_ACCESS_KEY: ${{ secrets.REPORTS_BUCKET_SECRET_ACCESS_KEY }}

      - name: Upload backend code documentation to ris-reports
        if: ${{ !cancelled() && hashFiles('tmp/backend-code-documentation/**') != '' }}
        uses: digitalservicebund/add-ris-report@31a248ea368f94bfa3a012da3c202bcc6be2debe
        with:
          filePath: tmp/backend-code-documentation
          destinationDir: search-code-documentation/java
          reportIsDirectory: true
          BUCKET_ACCESS_KEY_ID: ${{ secrets.REPORTS_BUCKET_ACCESS_KEY_ID }}
          BUCKET_SECRET_ACCESS_KEY: ${{ secrets.REPORTS_BUCKET_SECRET_ACCESS_KEY }}

      - name: Upload backend licence report to ris-reports
        if: ${{ !cancelled() && hashFiles('tmp/licence-reports-backend/**') != '' }}
        uses: digitalservicebund/add-ris-report@31a248ea368f94bfa3a012da3c202bcc6be2debe
        with:
          filePath: tmp/licence-reports-backend/backend-licence-report.html
          destinationDir: licence-reports/backend/ris-search
          BUCKET_ACCESS_KEY_ID: ${{ secrets.REPORTS_BUCKET_ACCESS_KEY_ID }}
          BUCKET_SECRET_ACCESS_KEY: ${{ secrets.REPORTS_BUCKET_SECRET_ACCESS_KEY }}

      - name: Upload frontend licence report to ris-reports
        if: ${{ !cancelled() && hashFiles('tmp/licence-reports-frontend/**') != '' }}
        uses: digitalservicebund/add-ris-report@31a248ea368f94bfa3a012da3c202bcc6be2debe
        with:
          filePath: tmp/licence-reports-frontend/frontend-licence-report.csv
          destinationDir: licence-reports/frontend/ris-search
          BUCKET_ACCESS_KEY_ID: ${{ secrets.REPORTS_BUCKET_ACCESS_KEY_ID }}
          BUCKET_SECRET_ACCESS_KEY: ${{ secrets.REPORTS_BUCKET_SECRET_ACCESS_KEY }}

      - name: Upload Storybook to ris-reports
        if: ${{ !cancelled() && hashFiles('tmp/storybook-static/**') != '' }}
        uses: digitalservicebund/add-ris-report@31a248ea368f94bfa3a012da3c202bcc6be2debe
        with:
          filePath: tmp/storybook-static
          destinationDir: style-guide/ris-search
          reportIsDirectory: true
          keepAllVersions: false
          BUCKET_ACCESS_KEY_ID: ${{ secrets.REPORTS_BUCKET_ACCESS_KEY_ID }}
          BUCKET_SECRET_ACCESS_KEY: ${{ secrets.REPORTS_BUCKET_SECRET_ACCESS_KEY }}

      - name: Upload E2E test reports to ris-reports
        if: ${{ !cancelled() && hashFiles('tmp/playwright-report/**') != '' }}
        uses: digitalservicebund/add-ris-report@31a248ea368f94bfa3a012da3c202bcc6be2debe
        with:
          filePath: tmp/playwright-report/
          destinationDir: test-reports/ris-search
          reportIsDirectory: true
          BUCKET_ACCESS_KEY_ID: ${{ secrets.REPORTS_BUCKET_ACCESS_KEY_ID }}
          BUCKET_SECRET_ACCESS_KEY: ${{ secrets.REPORTS_BUCKET_SECRET_ACCESS_KEY }}

      - name: Send status to Slack
        uses: digitalservicebund/notify-on-failure-gha@671832f192aee0a068fd92b2f6deb975df794a84 # v1.6.1
        if: ${{ failure() }}
        with:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.NEURIS_PORTAL_ALERTS_SLACK_CHANNEL_ID }}

  deploy-staging:
    needs:
      - backend-jobs
      - frontend-jobs
      - e2e-tests
    uses: $/.github/workflows/deploy.yml
    secrets:
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      ARGOCD_SERVER_STACKIT: ${{ secrets.ARGOCD_SERVER_STACKIT }}
      GITOPS_NEURIS_APP_ID: ${{ secrets.GITOPS_NEURIS_APP_ID }}
      GITOPS_NEURIS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_NEURIS_APP_PRIVATE_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    with:
      image-tag: ${{ github.sha }}
      deployment-environment: staging

  smoke-tests:
    needs:
      - deploy-staging
    uses: $/.github/workflows/smoke-tests.yml
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      STAGING_BASIC_AUTH_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
      STAGING_BASIC_AUTH_USERNAME: ${{ secrets.STAGING_BASIC_AUTH_USERNAME }}

  deploy-uat:
    needs:
      - smoke-tests
    uses: $/.github/workflows/deploy.yml
    secrets:
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      ARGOCD_SERVER_STACKIT: ${{ secrets.ARGOCD_SERVER_STACKIT }}
      GITOPS_NEURIS_APP_ID: ${{ secrets.GITOPS_NEURIS_APP_ID }}
      GITOPS_NEURIS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_NEURIS_APP_PRIVATE_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    with:
      image-tag: ${{ github.sha }}
      deployment-environment: uat

  deploy-prototype:
    needs:
      - deploy-uat
    uses: $/.github/workflows/deploy.yml
    secrets:
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      ARGOCD_SERVER_STACKIT: ${{ secrets.ARGOCD_SERVER_STACKIT }}
      GITOPS_NEURIS_APP_ID: ${{ secrets.GITOPS_NEURIS_APP_ID }}
      GITOPS_NEURIS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_NEURIS_APP_PRIVATE_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    with:
      image-tag: ${{ github.sha }}
      deployment-environment: prototype

  deploy-production:
    needs:
      - deploy-prototype
    uses: $/.github/workflows/deploy.yml
    secrets:
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      ARGOCD_SERVER_STACKIT: ${{ secrets.ARGOCD_SERVER_STACKIT }}
      GITOPS_NEURIS_APP_ID: ${{ secrets.GITOPS_NEURIS_APP_ID }}
      GITOPS_NEURIS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_NEURIS_APP_PRIVATE_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    with:
      image-tag: ${{ github.sha }}
      deployment-environment: prod
      argocd-app-name: ris-search-production
