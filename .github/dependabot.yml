# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 3
    groups:
      all-backend-non-major-dependencies:
        update-types:
          - minor
          - patch
  - package-ecosystem: "npm"
    directories:
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 3
    ignore:
      # vue-tsc 3.3.14 breaks templates with "//" in an attribute value, which
      # fails typecheck: https://github.com/vuejs/language-tools/issues/6322
      # Remove this once a fixed version is out.
      - dependency-name: "vue-tsc"
        versions: ["3.3.14"]
    groups:
      all-frontend-non-major-dependencies:
        update-types:
          - minor
          - patch
  - package-ecosystem: "npm"
    directories:
      - "/api-docs"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 3
    labels:
      - "api-docs"
      - "dependencies"
    ignore:
      # VitePress is pinned to a 2.0 prerelease. Every alpha so far has shipped
      # breaking changes, so bump it by hand. Remove this once 2.0 is stable.
      - dependency-name: "vitepress"
      # The api-docs tooling doesn't support TypeScript 7 yet, so stay on 6.x.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      all-api-docs-non-major-dependencies:
        update-types:
          - minor
          - patch
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/backend"
      - "/frontend"
      - "/api-docs"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 3
