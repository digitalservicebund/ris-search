# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 3
    groups:
      all-backend-non-major-dependencies:
        update-types:
          - minor
          - patch
  - package-ecosystem: "npm"
    directories:
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 3
    groups:
      all-frontend-non-major-dependencies:
        update-types:
          - minor
          - patch
  - package-ecosystem: "npm"
    directories:
      - "/api-docs"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 3
    labels:
      - "api-docs"
      - "dependencies"
    ignore:
      # VitePress is pinned to a 2.0 prerelease. Every alpha so far has shipped
      # breaking changes, so bump it by hand. Remove this once 2.0 is stable.
      - dependency-name: "vitepress"
    groups:
      all-api-docs-non-major-dependencies:
        update-types:
          - minor
          - patch
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/backend"
      - "/frontend"
      - "/api-docs"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 3
